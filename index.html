<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma wishlist de Noël</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f4; --surface:#ffffff; --ink:#1d1416; --muted:#7a6a6e; --line:#f0e1df;
  --accent:#d6202f; --accent-2:#1f9d55; --gold:#f5b942; --accent-ink:#ffffff; --flake:#9fb8e8;
  --shadow:0 1px 2px rgba(60,10,15,.05),0 10px 30px rgba(60,10,15,.08);
  --tile-a:#ffeceb; --tile-b:#e7f6ec;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120b0d; --surface:#1d1215; --ink:#f8eeee; --muted:#b39aa0; --line:#332024;
    --accent:#ff4d5a; --accent-2:#3ddc84; --gold:#ffd166; --accent-ink:#1a0709; --flake:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
    --tile-a:#3d1519; --tile-b:#13301f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120b0d; --surface:#1d1215; --ink:#f8eeee; --muted:#b39aa0; --line:#332024;
  --accent:#ff4d5a; --accent-2:#3ddc84; --gold:#ffd166; --accent-ink:#1a0709; --flake:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --tile-a:#3d1519; --tile-b:#13301f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(60rem 30rem at 15% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(50rem 28rem at 100% 0%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent);
  background-repeat:no-repeat;-webkit-font-smoothing:antialiased}
.wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:72px 20px 80px}
header{text-align:center;margin-bottom:36px}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:4px 0 12px;
  background:linear-gradient(100deg,var(--accent),var(--gold) 45%,var(--accent-2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;animation:shift 8s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 0}}
header p{margin:0;color:var(--muted);font-size:16px}
.countdown{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;
  color:var(--accent-ink);background:linear-gradient(100deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px;margin:0 0 28px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s,transform .25s}
.chip:hover{color:var(--ink);background:var(--line);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.search{flex:1 1 180px;max-width:260px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;outline:none;transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip:focus-visible,.btn:focus-visible,.done:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .35s,opacity .35s;animation:in .6s cubic-bezier(.2,.8,.2,1) both,spin 4s linear infinite;animation-delay:calc(var(--i)*40ms),0s}
.card:hover{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ang),var(--accent),var(--gold),var(--accent-2),var(--gold),var(--accent)) border-box;
  box-shadow:0 22px 46px color-mix(in srgb,var(--accent) 28%,transparent),0 0 34px color-mix(in srgb,var(--gold) 22%,transparent)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.5) 44%,color-mix(in srgb,var(--gold) 70%,#fff) 50%,rgba(255,255,255,.5) 56%,transparent 72%) var(--sx,0%) 50%/260% 100%}
.card:hover::after{opacity:1}
.tile{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .tile{transform:scale(1.03)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:8px}
.body{padding:14px 6px 4px;flex:1}
.body h2{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.body p{margin:0;font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:8px;padding:10px 6px 4px;align-items:center}
.btn{position:relative;overflow:hidden;flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;color:var(--accent-ink);background:var(--accent);padding:11px 14px;border-radius:12px;transition:filter .2s,transform .2s,box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{filter:brightness(1.08);transform:scale(1.03);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.btn:hover::after{left:130%}
.done{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all .25s}
.done:hover{color:var(--ink);border-color:var(--accent-2)}
.card.is-done{opacity:.55}
.card.is-done .btn{background:var(--line);color:var(--muted);pointer-events:none}
.card.is-done .done{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
.sel{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:9px 12px;border-radius:999px;cursor:pointer}
.ctl{display:flex;gap:8px;align-items:center;flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap}
.icon{border:1px solid var(--line);background:var(--bg);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;transition:transform .3s}
.icon:hover{transform:rotate(25deg)}
.sel:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:8px;max-width:320px;margin:18px auto 0;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1);
  background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#fff 10px 20px);background-size:28px 28px;animation:candy 1s linear infinite}
@keyframes candy{to{background-position:28px 0}}
/* Noël */
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.snow i{position:absolute;top:-30px;font-style:normal;color:var(--flake);opacity:.7;text-shadow:0 0 6px color-mix(in srgb,var(--flake) 60%,transparent);animation:fall linear infinite}
.snow i b{display:block;font-weight:400;animation:drift ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(112vh)}}
@keyframes drift{from{transform:translateX(-22px) rotate(0)}to{transform:translateX(22px) rotate(180deg)}}
.lights{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:46px;z-index:20;display:flex;justify-content:space-around;pointer-events:none;
  border-top:2px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:0 0 50% 50%/0 0 14px 14px}
.lights i{position:relative;top:2px;width:10px;height:16px;border-radius:50% 50% 55% 55%;background:var(--c);box-shadow:0 0 12px 3px var(--c);animation:twinkle 1.8s ease-in-out infinite;animation-delay:calc(var(--d)*-.3s)}
.lights i::before{content:"";position:absolute;top:-5px;left:2px;width:6px;height:6px;background:#555;border-radius:2px}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.85)}}
.spark{position:fixed;z-index:50;pointer-events:none;font-size:16px;will-change:transform,opacity}
.ground{position:fixed;left:0;right:0;bottom:0;height:26px;z-index:1;pointer-events:none;
  background:radial-gradient(18px 14px at 18px 100%,#fff 98%,transparent) 0 0/36px 26px repeat-x;opacity:.9;filter:drop-shadow(0 -2px 6px rgba(120,150,200,.35))}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
h1{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 35%,transparent));animation:shift 8s ease-in-out infinite alternate,titleIn 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes titleIn{from{opacity:0;filter:blur(18px);letter-spacing:.14em;transform:translateY(10px)}}
.rule{height:1px;width:0;margin:0 auto 18px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:draw 1.4s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{width:min(260px,60vw)}}
.countdown{animation:none;gap:5px;letter-spacing:.01em;padding:8px 20px;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 18%,transparent)}
.countdown b{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.countdown small{opacity:.7;margin-right:6px;font-weight:600}
.countdown span{margin-right:4px;opacity:.85}
.tools{animation:dropIn .9s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}}
.bar span{background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent));background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.body h2{position:relative;display:inline-block}
.body h2::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover h2::after{transform:scaleX(1)}
.aurora{inset:-60px;transform:translate(var(--px,0px),var(--py,0px));transition:transform .9s ease-out}
.bokeh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bokeh i{position:absolute;bottom:-120px;border-radius:50%;filter:blur(3px);animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx,20px),-118vh)}}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.24;animation:blob 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--accent);top:-15vmax;left:-10vmax}
.aurora i:nth-child(2){background:var(--accent-2);right:-15vmax;top:10vmax;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--gold);bottom:-22vmax;left:25vw;opacity:.16;animation-delay:-12s}
@keyframes blob{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.card.is-mine .done{border-color:var(--accent-2);color:var(--accent-2)}
.done:disabled{cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.snow,.aurora,.bokeh{display:none}.rule{width:200px}}
</style>
</head>
<body>
<div class="lights" id="lights" aria-hidden="true"></div>
<div class="snow" id="snow" aria-hidden="true"></div>
<div class="bokeh" id="bokeh" aria-hidden="true"></div>
<div class="aurora" id="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="ground" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>Ma wishlist de Noël</h1>
    <div class="rule" aria-hidden="true"></div>
    <div class="countdown" id="xmas"></div>
    <p id="count"></p>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
  </header>
  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Catégories"></div>
    <div class="ctl">
      <input class="search" id="q" type="search" placeholder="Rechercher… ( / )" aria-label="Rechercher un cadeau">
      <select class="sel" id="sort" aria-label="Trier"><option value="def">Ordre d’origine</option><option value="az">A → Z</option><option value="shop">Par boutique</option></select>
      <button class="icon" id="theme" type="button" aria-label="Changer de thème">🌓</button>
    </div>
  </div>
  <main class="grid" id="grid"></main>
</div>
<script>
const ITEMS=[
{n:"Emberton III",s:"Marshall",c:"Enceinte",e:"🧴",i:"https://boulanger.scene7.com/is/image/Boulanger/7340055402255_h_f_l_0?wid=535&hei=535&resMode=sharp2&op_usm=1.75,0.3,2,0&fmt=png-alpha",u:"https://www.marshall.com/fr/fr/product/emberton-iii?pid=1006884&utm_campaign=FR+%7C+Shopping+%7C+Brand+%7C+Speakers+%26+Headphones&gad_source=1&gad_campaignid=21297308594&gbraid=0AAAAADxIffWPhWe49SEtQ-0jYxQ7Eitj0&gclid=Cj0KCQiAk_DXBhCoARIsAHE-omPLSY2pTWG2uUW2eP5256m9ejPGjz4UuqzgG-aOrvqQWBw1C2axzmUaAhIwEALw_wcB"},
{n:"Montre connéctée",s:"apple watch",c:"tech",e:"🏺",i:"https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/s12-case-unselect-gallery-1-202609_GEO_FR?wid=5120&hei=3280&fmt=p-jpg&qlt=80&.v=Y1k0bnhVNzRteUVWdkpzbHlQZlRGM254NDR4QWcvRk5LSHlIc282VG82SEN5VTg0c25GRXpXdzZxQU5OeFU5bGZvSGF2dFhlaXl5ZzZDVTRMdEVvNldmalN5dlRpR2R3QUc1RGJwYllnWmdqTFVNcXFhbUc0SUJsRzBGMmtQTFM",u:"https://www.apple.com/fr/shop/buy-watch/apple-watch"},
{n:"Chaise",s:"chaise gaming",c:"meuble",e:"✨",i:"https://m.media-amazon.com/images/I/71MPmneYjfL._AC_SX679_.jpg",u:"https://www.amazon.fr/Symino-Ergonomique-Fauteuil-Repose-Pieds-T%C3%A9lescopique/dp/B0GDXT2YZB/ref=asc_df_B0GDXT2YZB?mcid=d2211dd441ab39a380215cbb20a40f90&tag=googshopfr-21&linkCode=df0&hvadid=791165003276&hvpos=&hvnetw=g&hvrand=13100723743729075191&hvpone=&hvptwo=&hvqmt=&hvdev=c&hvdvcmdl=&hvlocint=&hvlocphy=1006410&hvtargid=pla-2475952881054&hvocijid=13100723743729075191-B0GDXT2YZB-&hvexpln=0&th=1"},
{n:"Coque de telephone",s:"Rhinoshield",c:"tech",e:"📈",i:"https://image.rhinoshield.app/products/MCA01263O7-VR51?device-handle=iphone-14-pro-max&device-color=black&size=1080&lossless=1",u:"https://rhinoshield.fr/design-studio/collections/vangoghmuseum/VR51?identification=clear&device=iphone-14-pro-max&device_color=black&product_line=67&spec=O7&from=search"},
];
const grid=document.getElementById('grid'),chips=document.getElementById('chips'),q=document.getElementById('q'),count=document.getElementById('count');
const sortEl=document.getElementById('sort'),fill=document.getElementById('fill');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ===== RÉSERVATIONS PARTAGÉES (Firebase) =====
   Colle ici l'URL de ta Realtime Database (sans / final). */
const DB='https://wishlist-82959-default-rtdb.europe-west1.firebasedatabase.app';
const ON=!DB.includes('TON-PROJET');
const OWNER=(()=>{const p=new URLSearchParams(location.search).has('moi');
  try{if(p)localStorage.setItem('wl-owner','1');return localStorage.getItem('wl-owner')==='1'}catch(e){return p}})();
let cat='Tous',taken={},mine={};
try{mine=JSON.parse(localStorage.getItem('wl-mine')||'{}')}catch(e){}
const key=i=>{let h=0;for(const c of i.n+'|'+i.s)h=(h*31+c.charCodeAt(0))>>>0;return 'g'+h.toString(36)};
const S=k=>OWNER?'free':mine[k]?'mine':taken[k]?'taken':'free';
const label={free:'Réserver',mine:'Annuler',taken:'Réservé'};
const cls=i=>({taken:' is-done',mine:' is-mine',free:''})[S(key(i))];
const btn=i=>{const s=S(key(i));return `<button class="done" data-k="${key(i)}"${s==='taken'?' disabled':''}>${label[s]}</button>`};
const cats=['Tous',...new Set(ITEMS.map(i=>i.c).filter(Boolean))];
cats.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',c===cat);
  b.onclick=()=>{cat=c;[...chips.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};chips.appendChild(b)});
function stats(){
  if(OWNER){count.textContent=ITEMS.length+' idées cadeaux';document.querySelector('.bar').style.display='none';return}
  const left=ITEMS.filter(i=>!taken[key(i)]).length;
  count.textContent=left+' cadeau'+(left>1?'x':'')+' encore disponible'+(left>1?'s':'')+' sur '+ITEMS.length;
  fill.style.width=(100*(ITEMS.length-left)/ITEMS.length)+'%'}
function paint(){grid.querySelectorAll('.done').forEach(b=>{const k=b.dataset.k,s=S(k),c=b.closest('.card');
  b.textContent=label[s];b.disabled=s==='taken';c.classList.toggle('is-done',s==='taken');c.classList.toggle('is-mine',s==='mine')});stats()}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){
  const t=q.value.trim().toLowerCase();
  const list=ITEMS.filter(i=>(cat==='Tous'||i.c===cat)&&(i.n+' '+i.s).toLowerCase().includes(t));
  if(sortEl.value==='az')list.sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  if(sortEl.value==='shop')list.sort((a,b)=>a.s.localeCompare(b.s,'fr'));
  grid.innerHTML=list.length?list.map((i,k)=>`<article class="card${cls(i)}" style="--i:${k}">
    <div class="tile" aria-hidden="true"><span>${i.e}</span>${i.i?'<img src="'+esc(i.i)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':''}</div>
    <div class="body"><h2>${esc(i.n)}</h2><p>${esc(i.s)}</p></div>
    <div class="row"><a class="btn" href="${esc(i.u)}" target="_blank" rel="noopener">Voir le produit</a>
    ${OWNER?'':btn(i)}</div></article>`).join(''):'<p class="empty">Aucun cadeau ne correspond à cette recherche.</p>';
  stats();
}
function burst(x,y,N=18){
  if(calm)return;
  const cs=['var(--accent)','var(--gold)','#fff','var(--accent-2)'];
  for(let n=0;n<N;n++){
    const p=document.createElement('span'),w=4+Math.random()*5;p.className='spark';
    p.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${Math.random()<.5?w:w*2.4}px;background:${cs[n%4]};border-radius:${Math.random()<.5?'50%':'1px'}`;
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
    p.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+60}px)) scale(1) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:1000+Math.random()*600,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>p.remove();
  }
}
grid.addEventListener('click',async e=>{const b=e.target.closest('.done');if(!b||b.disabled)return;
  const k=b.dataset.k,on=!mine[k],r=b.getBoundingClientRect();
  if(on){await pull();if(taken[k]&&!mine[k])return}
  const set=v=>{if(v){mine[k]=true;taken[k]=true}else{delete mine[k];delete taken[k]}
    try{localStorage.setItem('wl-mine',JSON.stringify(mine))}catch(_){}paint()};
  set(on);if(on)burst(r.left+r.width/2,r.top+r.height/2,42);
  if(!ON)return;
  try{const x=await fetch(DB+'/reservations/'+k+'.json',on?{method:'PUT',body:'true'}:{method:'DELETE'});if(!x.ok)throw 0}
  catch(_){set(!on);alert('Connexion impossible, réessaie dans un instant.')}});
q.addEventListener('input',render);
sortEl.addEventListener('change',render);
const root=document.documentElement;
try{const t=localStorage.getItem('wl-theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('theme').onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const n=dark?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('wl-theme',n)}catch(e){}};
grid.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');c.style.setProperty('--sx',(x*100)+'%');
  if(e.pointerType==='mouse'&&!calm){c.style.setProperty('--ry',((x-.5)*14)+'deg');c.style.setProperty('--rx',((.5-y)*14)+'deg')}});
grid.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
grid.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.remove()},true);
/* Neige */
const snow=document.getElementById('snow'),fl=['•','•','•','❅'];
for(let i=0;i<38;i++){const s=document.createElement('i'),b=document.createElement('b');b.textContent=fl[i%4];
  s.style.left=(i*2.7+(i%3))+'%';s.style.fontSize=(14+i%5*8)+'px';s.style.filter='blur('+(i%3*.7)+'px)';
  s.style.animationDuration=(9+i%7*2.5)+'s';s.style.animationDelay=(-i*1.3)+'s';
  b.style.animationDuration=(3+i%4)+'s';b.style.animationDelay=(-i*.7)+'s';s.appendChild(b);snow.appendChild(s)}
/* Guirlande */
const lights=document.getElementById('lights'),cols=['#ff3b4a','#ffd166','#3ddc84','#4db8ff','#ff8fd0'];
for(let i=0;i<22;i++){const l=document.createElement('i');l.style.setProperty('--c',cols[i%5]);l.style.setProperty('--d',i%6);lights.appendChild(l)}
/* Compte à rebours */
(function(){const el=document.getElementById('xmas'),p=n=>String(n).padStart(2,'0');
  function tick(){const now=new Date(),y=now.getFullYear();let noel=new Date(y,11,25);
    if(now>=noel&&now<new Date(y,11,26)){el.textContent='Joyeux Noël';return}
    if(now>=new Date(y,11,26))noel=new Date(y+1,11,25);
    const t=Math.floor((noel-now)/1e3),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),sc=t%60;
    el.innerHTML=`<span>Noël dans</span><b>${d}</b><small>j</small><b>${p(h)}</b><small>h</small><b>${p(m)}</b><small>min</small><b>${p(sc)}</b><small>s</small>`}
  tick();setInterval(tick,1000)})();
/* Étincelles au clic */
addEventListener('pointerdown',e=>{if(!e.target.closest('.done'))burst(e.clientX,e.clientY)});
/* Bokeh, parallaxe, traînée, boutons magnétiques */
const bk=document.getElementById('bokeh'),bc=['var(--gold)','var(--accent)','#fff','var(--accent-2)'];
for(let i=0;i<16;i++){const d=document.createElement('i'),z=24+Math.random()*80;
  d.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;opacity:${.1+Math.random()*.14};background:radial-gradient(circle at 35% 35%,color-mix(in srgb,${bc[i%4]} 70%,transparent),transparent 70%);--dx:${Math.random()*80-40}px;animation-duration:${22+Math.random()*30}s;animation-delay:${-Math.random()*40}s`;bk.appendChild(d)}
const aur=document.getElementById('aurora');
function trail(x,y){const t=document.createElement('span'),w=3+Math.random()*4;t.className='spark';
  t.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${w}px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)`;document.body.appendChild(t);
  t.animate([{transform:'translate(-50%,-50%)',opacity:.9},{transform:`translate(${Math.random()*24-12}px,${16+Math.random()*26}px) scale(.2)`,opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>t.remove()}
let lt=0;addEventListener('pointermove',e=>{if(calm||e.pointerType!=='mouse')return;
  aur.style.setProperty('--px',((e.clientX/innerWidth-.5)*-50)+'px');aur.style.setProperty('--py',((e.clientY/innerHeight-.5)*-50)+'px');
  if(e.timeStamp-lt<45)return;lt=e.timeStamp;trail(e.clientX,e.clientY)});
grid.addEventListener('pointermove',e=>{const b=e.target.closest('.btn');if(!b||calm)return;const r=b.getBoundingClientRect();
  b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.12}px,${(e.clientY-r.top-r.height/2)*.25}px) scale(1.03)`});
grid.addEventListener('pointerout',e=>{const b=e.target.closest('.btn');if(b)b.style.transform=''});
async function pull(){if(!ON)return;
  try{const r=await fetch(DB+'/reservations.json'),d=(await r.json())||{};
    if(JSON.stringify(d)!==JSON.stringify(taken)){taken=d;paint()}}catch(e){}}
render();pull();setInterval(pull,8000);addEventListener('focus',pull);
</script>
</body>
</html>
